<!DOCTYPE html>
<html>
<head>
    <title>Success</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .success-box {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        
        h2 {
            color: #025e94;   
            margin-bottom: 25px;
        }

        /* Back to Home Button */
        .home-btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(to right, #007bff, #0056d6);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px);
        }

    </style>
</head>
<body>
    <div class="success-box">
        <h2>Application Submitted Successfully!</h2>

        <!-- Back to Home Button -->
    
    <a href="/" class="back-btn">← Go To Home</a>

    </div>
</body>
</html>
