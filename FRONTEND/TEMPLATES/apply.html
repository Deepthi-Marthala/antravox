        <!-- ================= APPLICATION FORM ================= -->
        <form action="{{ url_for('submit') }}"
              method="POST"
              class="apply-form"
              enctype="multipart/form-data">

            <label>Full Name *</label>
            <input type="text" name="Student_Name" required>

            <label>Email *</label>
            <input type="email" name="Student_Email" required>

            <label>Role *</label>
            <select name="Student_Role" required>
                <option value="">-- Select Role --</option>
                <option value="Developer" {{ 'selected' if role == 'Developer' else '' }}>Developer</option>
                <option value="Marketing" {{ 'selected' if role == 'Marketing' else '' }}>Marketing</option>
                <option value="Internship" {{ 'selected' if role == 'Internship' else '' }}>Internship</option>
            </select>

            <label>Qualification *</label>
            <select name="Student_Qualification" required>
                <option value="">-- Select Qualification --</option>
                <option>B.Tech / B.E</option>
                <option>MCA</option>
                <option>M.Tech</option>
            </select>

            <label>Gender *</label>
            <select name="Student_Gender" required>
                <option value="">-- Select Gender --</option>
                <option>FEMALE</option>
                <option>MALE</option>
                <option>PREFER NOT TO SAY</option>
            </select>

            <label>College / University *</label>
            <input type="text" name="Student_College_University" required>

            <label>Branch *</label>
            <select name="Student_Branch" required>
                <option value="">-- Select Branch --</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>AI/ML</option>
                <option>Cyber Security</option>
                <option>Data Science</option>
                <option>EEE</option>
                <option>Others</option>
            </select>

            <label>Upload Resume *</label>
            <input type="file"
                   name="Student_Resume"
                   accept=".pdf,.doc,.docx"
                   required>

            <button type="submit" class="submit-btn">
                Submit Application
            </button>

        </form>

    </div>
</div>
